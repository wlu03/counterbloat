# Evaluation runs use a fixed corpus and no external discovery.
mode: frozen
max_investigation_rounds: 2
retrieval:
  candidates_per_query: 30
  retained_passages_per_question: 8
  preserve_critical_context: true
optimization:
  jev_routing: false
  protected_compression: false
assessment:
  updater: linguistic
  # Three samples, majority status. One sample decides a verdict on its own otherwise.
  updater_samples: 3
  public_numeric_probability: false
  review_original_decisive_evidence: true
