services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: countercheck
      POSTGRES_PASSWORD: countercheck
      POSTGRES_DB: countercheck
    ports: ["5432:5432"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
