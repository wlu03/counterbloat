[project]
name = "countercheck"
version = "0.1.0"
description = "Evidence-based corporate claim auditor"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "lxml==6.1.3",
  "pdfplumber==0.11.10",
  "openai==3.16.2",
  "elasticsearch==9.5.1",
  "pyyaml>=6",
]

[dependency-groups]
# The upstream FinQA and AVeriTeC evaluators the benchmark kit downloads need these.
dev = [
  "pytest>=8",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "nltk>=3.8,<4",
  "sympy>=1.12,<2",
  "tqdm>=4.66,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
